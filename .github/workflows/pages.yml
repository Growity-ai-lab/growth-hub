name: Pages — öneri arayüzü

# Gerçek motoru (growth-hub/arayuz/oneri.py) çalıştırıp statik veriyi üretir ve
# GitHub Pages'e yayınlar. Proje repo kökünün altındaki growth-hub/ klasöründe;
# bu iş akışı ise Actions tarafından okunabilmesi için repo KÖKÜNDE durur.
# Karne ya da sözlük değişince arayüz otomatik güncellenir; terminal gerekmez.

on:
  push:
    branches:
      - main
    paths:
      - 'growth-hub/puanlama/karne.json'
      - 'growth-hub/sozluk/sozluk.xlsx'
      - 'growth-hub/sozluk/sozluk.py'
      - 'growth-hub/arayuz/oneri.py'
      - 'growth-hub/arayuz/kararlar.py'
      - 'growth-hub/arayuz/pages/**'
      - 'growth-hub/arayuz/pages_uret.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pages'i Actions kaynağına ayarla (mümkünse otomatik)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Supabase yapılandırmasını yaz (repo secret'larından; boşsa indir-only)
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > growth-hub/arayuz/pages/supabase-config.js <<EOF
          window.SUPABASE = { url: '${SB_URL}', anonKey: '${SB_ANON}' };
          EOF
      - name: Motor varlıklarını Pages'e kopyala (Pyodide için)
        run: python3 growth-hub/arayuz/pages_uret.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: growth-hub/arayuz/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
